name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          flutter create --project-name daily_azkar --platforms=android --org com.example .
          rm -f test/widget_test.dart

      - name: Patch Android project (permissions, reminders, app name)
        run: python3 tool/patch_android.py .

      - name: Show compileSdk (debug)
        run: grep -n "compileSdk" android/app/build.gradle* || true

      - name: Install packages
        run: flutter pub get

      - name: Check code (errors fail the build early)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-azkar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
